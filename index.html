<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#170f2e"><title>等你上岸｜一份专属祝福</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100svh;overflow:hidden;color:#fff8f3;background:radial-gradient(ellipse at 50% 110%,#80415d 0,#3a214b 38%,#170f2e 78%);display:grid;place-items:center}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff7d7;box-shadow:0 0 12px 3px #fff1b477;animation:twinkle var(--d) ease-in-out infinite alternate;opacity:.2}.shoot{position:absolute;width:90px;height:1px;background:linear-gradient(90deg,#ffffff00,#ffe8bd);transform:rotate(-35deg);animation:shoot 7s linear infinite;opacity:0}.shoot:nth-child(2){top:18%;left:75%;animation-delay:2s}.shoot:nth-child(3){top:40%;left:20%;animation-delay:5s}.card{position:relative;width:min(90vw,440px);min-height:590px;padding:40px 27px 35px;text-align:center;border:1px solid #ffffff24;border-radius:30px;background:linear-gradient(150deg,#ffffff12,#ffffff05);box-shadow:0 24px 90px #09061488;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both}.moon{width:72px;height:72px;border-radius:50%;background:#ffe9b7;box-shadow:0 0 38px #ffdfaa88;position:relative;margin-bottom:20px;animation:float 4s ease-in-out infinite}.moon:after{content:"";position:absolute;width:65px;height:65px;left:18px;top:-8px;border-radius:50%;background:#26183c}.eyebrow{letter-spacing:.28em;font-size:12px;color:#f8c6d0;margin:0 0 14px}.title{font-size:clamp(34px,10vw,50px);line-height:1.2;letter-spacing:.06em;margin:0;font-weight:800;text-shadow:0 3px 24px #ffb6cb55}.title span{display:block;color:#ffd995;margin-top:5px}.rule{width:42px;height:1px;background:#ffdaab;margin:23px auto}.message{font-size:16px;line-height:2;color:#f1e4ed;margin:0;max-width:310px}.message strong{color:#ffe0aa;font-weight:700}.flower{font-size:31px;margin:25px 0 12px;filter:drop-shadow(0 0 12px #ff9db8aa);animation:sway 3s ease-in-out infinite}.hint{font-size:12px;color:#d5bdd1;letter-spacing:.08em;margin:0}.button{margin-top:23px;padding:12px 24px;border:1px solid #ffdfb5aa;border-radius:99px;background:#ffffff10;color:#fff4e8;font-size:14px;cursor:pointer;transition:.25s}.button:active{transform:scale(.96);background:#ffffff25}.hidden{display:none}.reveal{font-size:18px;color:#ffe1a6;line-height:1.8;margin-top:18px;animation:fade .8s both}.petal{position:fixed;top:-10vh;font-size:18px;opacity:.7;animation:fall linear infinite;pointer-events:none}@keyframes twinkle{to{opacity:.95;transform:scale(1.5)}}@keyframes shoot{0%,75%{opacity:0;transform:translate(0,0) rotate(-35deg)}78%{opacity:.9}100%{opacity:0;transform:translate(-240px,170px) rotate(-35deg)}}@keyframes arrive{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes sway{50%{transform:rotate(8deg) scale(1.08)}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(115vh) rotate(500deg);opacity:0}}@media(max-height:700px){.card{min-height:0;padding:24px 22px}.moon{width:54px;height:54px;margin-bottom:12px}.moon:after{width:50px;height:50px;left:14px}.rule{margin:14px auto}.flower{margin:14px 0 8px}.button{margin-top:15px}}
</style></head>
<body><div class="sky" id="sky"><i class="shoot"></i><i class="shoot"></i></div><main class="card"><div class="moon"></div><p class="eyebrow">TO THE BRIGHTEST YOU</p><h1 class="title">考研<span>必定上岸</span></h1><p class="eyebrow" style="margin-top:10px;font-size:14px;letter-spacing:.18em;color:#ffe0aa">一战成硕 · 金榜题名</p><div class="rule"></div><p class="message">把熬过的夜、写过的题，<br>都变成奔向梦想的光。<br><strong>愿你落笔生花，合上笔盖的那刻，<br>有侠客收剑入鞘的骄傲。</strong></p><div class="flower">🌷</div><p class="hint">你的努力，终会有回响</p><button class="button" id="btn">点亮这份祝福 ✨</button><div class="reveal hidden" id="reveal">所愿皆所得，前路皆坦途。<br>我们在岸上等你！</div></main>
<script>
const sky=document.getElementById('sky');for(let i=0;i<54;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--d',(1.3+Math.random()*3)+'s');s.style.animationDelay=(-Math.random()*4)+'s';sky.appendChild(s)}document.getElementById('btn').addEventListener('click',()=>{document.getElementById('reveal').classList.remove('hidden');document.getElementById('btn').textContent='祝福已送达 💌';for(let i=0;i<18;i++){const p=document.createElement('span');p.className='petal';p.textContent=['🌸','✨','🌷'][i%3];p.style.left=Math.random()*100+'vw';p.style.animationDuration=(4+Math.random()*4)+'s';p.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),9000)}});
</script></body></html>
