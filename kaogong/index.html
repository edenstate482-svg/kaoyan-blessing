<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132238"><title>愿你一举成公｜给认真生活的你</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100svh;overflow-x:hidden;overflow-y:auto;color:#f8f4ec;background:radial-gradient(ellipse at 50% 110%,#526b68 0,#263e50 42%,#132238 82%);display:grid;place-items:center;padding:18px 0}.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3ce;box-shadow:0 0 12px 3px #fff1b477;animation:twinkle var(--d) ease-in-out infinite alternate;opacity:.22}.shoot{position:absolute;width:95px;height:1px;background:linear-gradient(90deg,#ffffff00,#fff0c6);transform:rotate(-35deg);animation:shoot 8s linear infinite;opacity:0}.shoot:nth-child(2){top:18%;left:72%;animation-delay:2s}.shoot:nth-child(3){top:42%;left:19%;animation-delay:5s}.card{position:relative;width:min(91vw,460px);min-height:620px;padding:38px 26px 32px;text-align:center;border:1px solid #ffffff25;border-radius:30px;background:linear-gradient(150deg,#ffffff13,#ffffff06);box-shadow:0 24px 90px #09121d88;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:arrive 1s cubic-bezier(.2,.8,.2,1) both}.sun{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#fff0be,#e5b873);box-shadow:0 0 40px #f1d09566;margin-bottom:20px;animation:float 4s ease-in-out infinite}.eyebrow{letter-spacing:.24em;font-size:12px;color:#d9d5b7;margin:0 0 14px}.title{font-size:clamp(34px,10vw,50px);line-height:1.2;letter-spacing:.06em;margin:0;font-weight:800;text-shadow:0 3px 24px #f2d18d44}.title span{display:block;color:#ffe0a1;margin-top:5px}.tag{font-size:13px;color:#ded6bb;letter-spacing:.13em;margin:14px 0 0}.rule{width:42px;height:1px;background:#e9d3a2;margin:22px auto}.message{font-size:15px;line-height:2;color:#eee9e0;margin:0;max-width:340px}.message strong{color:#ffe1a5;font-weight:700}.flower{font-size:30px;margin:20px 0 9px;filter:drop-shadow(0 0 12px #f1d09588);animation:sway 3s ease-in-out infinite}.hint{font-size:12px;color:#c7d0c9;letter-spacing:.08em;margin:0}.button{margin-top:21px;padding:12px 24px;border:1px solid #f0d7a0aa;border-radius:99px;background:#ffffff10;color:#fff7e9;font-size:14px;cursor:pointer;transition:.2s}.button:active{transform:scale(.96)}.reveal{font-size:17px;color:#ffe0a1;line-height:1.8;margin-top:16px;animation:fade .8s both}.hidden{display:none}.petal{position:fixed;top:-10vh;font-size:18px;opacity:.75;animation:fall linear infinite;pointer-events:none}@keyframes twinkle{to{opacity:.95;transform:scale(1.5)}}@keyframes shoot{0%,75%{opacity:0;transform:translate(0,0) rotate(-35deg)}78%{opacity:.9}100%{opacity:0;transform:translate(-240px,170px) rotate(-35deg)}}@keyframes arrive{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes sway{50%{transform:rotate(8deg) scale(1.08)}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(115vh) rotate(500deg);opacity:0}}@media(max-height:720px){.card{min-height:0;padding:24px 21px}.sun{width:55px;height:55px;margin-bottom:12px}.rule{margin:14px auto}.flower{margin:13px 0 8px}.button{margin-top:15px}}
</style></head><body><div class="sky" id="sky"><i class="shoot"></i><i class="shoot"></i></div><main class="card"><div class="sun"></div><p class="eyebrow">TO THE ONE WHO NEVER GAVE UP</p><h1 class="title">考公<span>一定上岸</span></h1><p class="tag">愿每一份认真，都有回响</p><div class="rule"></div><p class="message">你已经认真努力了一整年，<br>那些咬牙坚持的日子，都算数。<br><strong>无论最后结果如何，<br>你都勇敢地尝试过、全力以赴过，<br>所以不必后悔，也别怀疑自己。</strong><br>未来的路还很长，你的前方依然一片坦途。<br>而此刻，我还是想坚定地祝福你：<br><strong>愿你如愿以偿，一举成公，顺利上岸！</strong></p><div class="flower">🌟</div><p class="hint">你走过的每一步，都在通往更好的未来</p><button class="button" id="btn">收下这份祝福 ✨</button><div class="reveal hidden" id="reveal">愿你心有所期，终有所得。<br>等你好消息！</div></main><script>const sky=document.getElementById('sky');for(let i=0;i<54;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--d',(1.3+Math.random()*3)+'s');s.style.animationDelay=(-Math.random()*4)+'s';sky.appendChild(s)}document.getElementById('btn').addEventListener('click',()=>{document.getElementById('reveal').classList.remove('hidden');document.getElementById('btn').textContent='祝福已送达 💌';for(let i=0;i<18;i++){const p=document.createElement('span');p.className='petal';p.textContent=['✨','🌟','💫'][i%3];p.style.left=Math.random()*100+'vw';p.style.animationDuration=(4+Math.random()*4)+'s';p.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),9000)}});</script></body></html>
